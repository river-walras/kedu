[project]
name = "kedu"
version = "0.1.2"
description = "Local ClickHouse replica of JoinQuant jqdatasdk APIs (get_fundamentals / get_price / finance.run_query / 交易日历 / 证券列表)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect[pandas]>=1.1.1",
    "h5py>=3.16.0",
    "pandas>=2.2,<4",
    "pyarrow>=20.0.0",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "sqlglot>=30.8.0",
]

[dependency-groups]
dev = [
    "jqdatasdk>=1.9.8",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::sqlalchemy.exc.MovedIn20Warning",
    "ignore:The 'u' type code is deprecated.*:DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10"]
build-backend = "uv_build"
